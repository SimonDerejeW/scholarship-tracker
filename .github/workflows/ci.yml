# Runs the same checks CONTRIBUTING.md asks for before a PR.
# Tests use PGlite (in-process Postgres), so no database or secrets are needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
